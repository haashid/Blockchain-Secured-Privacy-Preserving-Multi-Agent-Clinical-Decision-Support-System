# Hyperledger Fabric Network - Docker Compose
# Starts orderer, peers (Org1 + Org2), CouchDB state databases, and CLI.

networks:
  ai-coordination:
    name: ai-coordination

volumes:
  orderer.ai-coordination.com:
  peer0.org1.ai-coordination.com:
  peer0.org2.ai-coordination.com:
  couchdb0:
  couchdb1:

services:
  orderer.ai-coordination.com:
    container_name: orderer.ai-coordination.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    command: orderer
    volumes:
      - ../network/crypto-config/ordererOrganizations/ai-coordination.com/orderers/orderer.ai-coordination.com/msp:/var/hyperledger/orderer/msp
      - ../network/crypto-config/ordererOrganizations/ai-coordination.com/orderers/orderer.ai-coordination.com/tls:/var/hyperledger/orderer/tls
      - orderer.ai-coordination.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - ai-coordination

  couchdb0:
    container_name: couchdb0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb0:/opt/couchdb/data
    networks:
      - ai-coordination

  peer0.org1.ai-coordination.com:
    container_name: peer0.org1.ai-coordination.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.ai-coordination.com
      - CORE_PEER_ADDRESS=peer0.org1.ai-coordination.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.ai-coordination.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.ai-coordination.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.ai-coordination.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=ai-coordination
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../network/crypto-config/peerOrganizations/org1.ai-coordination.com/peers/peer0.org1.ai-coordination.com/msp:/etc/hyperledger/fabric/msp
      - ../network/crypto-config/peerOrganizations/org1.ai-coordination.com/peers/peer0.org1.ai-coordination.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.ai-coordination.com:/var/hyperledger/production
    ports:
      - "7051:7051"
    depends_on:
      - couchdb0
    networks:
      - ai-coordination

  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    volumes:
      - couchdb1:/opt/couchdb/data
    networks:
      - ai-coordination

  peer0.org2.ai-coordination.com:
    container_name: peer0.org2.ai-coordination.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org2.ai-coordination.com
      - CORE_PEER_ADDRESS=peer0.org2.ai-coordination.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.ai-coordination.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.ai-coordination.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.ai-coordination.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=ai-coordination
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../network/crypto-config/peerOrganizations/org2.ai-coordination.com/peers/peer0.org2.ai-coordination.com/msp:/etc/hyperledger/fabric/msp
      - ../network/crypto-config/peerOrganizations/org2.ai-coordination.com/peers/peer0.org2.ai-coordination.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org2.ai-coordination.com:/var/hyperledger/production
    ports:
      - "9051:9051"
    depends_on:
      - couchdb1
    networks:
      - ai-coordination

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.ai-coordination.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/network/crypto-config/peerOrganizations/org1.ai-coordination.com/users/Admin@org1.ai-coordination.com/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/network/crypto-config/peerOrganizations/org1.ai-coordination.com/peers/peer0.org1.ai-coordination.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/network/crypto-config/peerOrganizations/org1.ai-coordination.com/peers/peer0.org1.ai-coordination.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/network/crypto-config/peerOrganizations/org1.ai-coordination.com/peers/peer0.org1.ai-coordination.com/tls/ca.crt
    working_dir: /opt/gopath/src
    command: /bin/bash
    volumes:
      - ../network:/opt/gopath/src/network
      - ../scripts:/opt/gopath/src/scripts
      - ../../blockchain/chaincode:/opt/gopath/src/chaincode
      - /var/run/docker.sock:/host/var/run/docker.sock
    depends_on:
      - peer0.org1.ai-coordination.com
      - peer0.org2.ai-coordination.com
    networks:
      - ai-coordination
